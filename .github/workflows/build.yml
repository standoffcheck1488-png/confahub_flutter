name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Flutter project structure
      run: flutter create . --project-name eclips

    - name: Add WireGuard core dependency
      run: |
        echo "" >> android/app/build.gradle
        echo "dependencies {" >> android/app/build.gradle
        echo '    implementation("com.wireguard.android:tunnel:+")' >> android/app/build.gradle
        echo "}" >> android/app/build.gradle
        cat android/app/build.gradle

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: build/app/outputs/flutter-apk/app-release.apk
