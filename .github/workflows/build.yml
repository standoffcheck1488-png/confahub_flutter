name: Build Eclips APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Prepare clean project
      run: |
        flutter create /tmp/eclips --project-name eclips --platforms android
        cp pubspec.yaml /tmp/eclips/
        rm -rf /tmp/eclips/lib
        cp -r lib /tmp/eclips/
        cp android/app/src/main/AndroidManifest.xml /tmp/eclips/android/app/src/main/AndroidManifest.xml
        mkdir -p /tmp/eclips/android/app/src/main/kotlin/com/example/eclips
        cp android/app/src/main/kotlin/com/example/eclips/MainActivity.kt /tmp/eclips/android/app/src/main/kotlin/com/example/eclips/MainActivity.kt
        echo "" >> /tmp/eclips/android/app/build.gradle
        echo "dependencies {" >> /tmp/eclips/android/app/build.gradle
        echo '    implementation("com.wireguard.android:tunnel:+")' >> /tmp/eclips/android/app/build.gradle
        echo "}" >> /tmp/eclips/android/app/build.gradle

    - name: Install dependencies
      run: cd /tmp/eclips && flutter pub get

    - name: Build APK
      run: cd /tmp/eclips && flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: eclips-apk
        path: /tmp/eclips/build/app/outputs/flutter-apk/app-release.apk
